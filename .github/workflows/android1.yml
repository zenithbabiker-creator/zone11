name: 🤖 Android CI - Huawei Stable Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🛠️ Build Debug & Release APKs (with retries)
        run: |
          for i in 1 2 3; do
            ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon && break
            echo "Build failed (attempt $i). Retrying in 10s..."
            sleep 10
          done

      - name: 📦 Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: home-landscaping-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

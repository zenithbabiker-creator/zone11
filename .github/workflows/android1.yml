name: 🤖 Huawei Dependency Matrix Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # التجربة الأولى: المستودع الرسمي لهواوي + الإصدار الأحدث 6.13.0.300
          - repo_url: "https://developer.huawei.com/repo/"
            hms_version: "6.13.0.300"
            strategy_name: "Official-Repo-Latest"

          # التجربة الثانية: مرآة HuaweiCloud السريعة + الإصدار الأحدث 6.13.0.300
          - repo_url: "https://repo.huaweicloud.com/repository/maven/"
            hms_version: "6.13.0.300"
            strategy_name: "HuaweiCloud-Repo-Latest"

          # التجربة الثالثة: مستودع AGConnect الأصلي + الإصدار الأحدث 6.13.0.300
          - repo_url: "https://developer.agconnect.com/repo/"
            hms_version: "6.13.0.300"
            strategy_name: "AGConnect-Repo-Latest"

          # التجربة الرابعة: المرآة السريعة + الإصدار السابق (Stable) 6.11.0.300
          - repo_url: "https://repo.huaweicloud.com/repository/maven/"
            hms_version: "6.11.0.300"
            strategy_name: "HuaweiCloud-Repo-Stable"

          # التجربة الخامسة: المستودع الرسمي + الإصدار السابق 6.11.0.300
          - repo_url: "https://developer.huawei.com/repo/"
            hms_version: "6.11.0.300"
            strategy_name: "Official-Repo-Stable"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: ⚙️ Inject repository and version dynamically for ${{ matrix.strategy_name }}
        run: |
          echo "Testing Strategy: ${{ matrix.strategy_name }}"
          echo "Using Repo: ${{ matrix.repo_url }}"
          echo "Using HMS Version: ${{ matrix.hms_version }}"

          # تعديل ملف settings.gradle ليتوافق مع المستودع المختبر ديناميكياً
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google {
                      content {
                          includeGroupByRegex("com\\.android.*")
                          includeGroupByRegex("com\\.google.*")
                          includeGroupByRegex("androidx.*")
                      }
                  }
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url = uri("${{ matrix.repo_url }}") }
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven(url = "${{ matrix.repo_url }}")
              }
          }

          rootProject.name = "zone11"
          include(":app")
          EOF

          # تحديث إصدارات هواوي في ملف الـ app/build.gradle ديناميكياً بناءً على الماتريكس
          sed -i 's/:6.13.0.300/:${{ matrix.hms_version }}/g' app/build.gradle
          sed -i 's/:1.9.0.300/:${{ matrix.hms_version }}/g' app/build.gradle

      - name: 🛠️ Build Debug APK with retries
        run: |
          for i in 1 2 3; do
            ./gradlew assembleDebug --stacktrace --no-daemon && break
            echo "Build failed on attempt $i. Retrying..."
            sleep 5
          done

      - name: 📦 Upload APK artifacts if successful
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ matrix.strategy_name }}
          path: app/build/outputs/apk/debug/
          if-no-files-found: ignore

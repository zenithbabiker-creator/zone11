name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          for i in 1 2 3; do
            ./gradlew assembleDebug --stacktrace --no-daemon && break
            echo "Gradle failed (attempt $i). Retrying..."
            sleep $((i * 10))
          done

      - name: Build Release APK
        run: |
          for i in 1 2 3; do
            ./gradlew assembleRelease --stacktrace --no-daemon && break
            echo "Gradle failed (attempt $i). Retrying..."
            sleep $((i * 10))
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: home-landscaping-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
